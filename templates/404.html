{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina no encontrada - Hotel Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #4e73df;
            text-shadow: 4px 4px 0 #ddd;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="error-code">404</div>
                <h2 class="mb-3">
                    <i class="bi bi-signpost-split text-warning"></i> 
                    Pagina no encontrada
                </h2>
                <p class="text-muted mb-4">
                    La ruta solicitada no existe en el sistema.
                </p>
                
                <div class="card shadow-sm mb-4">
                    <div class="card-body text-start">
                        <h6 class="fw-bold"><i class="bi bi-compass me-2"></i>Quizas buscabas:</h6>
                        <div class="list-group list-group-flush">
                            <a href="/hotel/" class="list-group-item list-group-item-action">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                            <a href="/hotel/habitaciones/" class="list-group-item list-group-item-action">
                                <i class="bi bi-door-open me-2"></i>Panel de Habitaciones
                            </a>
                            <a href="/admin/" class="list-group-item list-group-item-action">
                                <i class="bi bi-gear me-2"></i>Administracion
                            </a>
                        </div>
                    </div>
                </div>
                
                <a href="/hotel/" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door me-2"></i>Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
